[project]
name = "cybergym-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "huggingface_hub>=0.30",
    "ray>=2.40",
]

[project.scripts]
cybergym-eval = "cybergym_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybergym_eval"]
